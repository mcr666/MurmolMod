plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '2.1.3'
base.archivesName = "murmol"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        // JEI maven
        url = "https://maven.blamejared.com/"
    }
}

// NeoOrigins API 手写 stub（参照 NeoOrigins 对 irons_spellbooks 的做法）：
// stub 源码并入主源集编译（src/apistubs/java），打包时从 JAR 排除，仅编译期可见
sourceSets.main.java.srcDirs += 'src/apistubs/java'

dependencies {
    compileOnly "org.jetbrains:annotations:24.0.1"

    // JEI：编译用 API，本地运行时带完整 JEI（不打包进最终 JAR）
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.16.4.183"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.16.4.183"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.16.4.183"

    // Patchouli：编译用 API（openBookGUI），运行时本地加载完整 Patchouli（不打包进最终 JAR）
    compileOnly "vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE"
    runtimeOnly "vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE"
}

neoForge {
    version = "21.1.232"

    runs {
        client {
            client()
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        murmol {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('jar', Jar).configure {
    // NeoOrigins stub 不打进 JAR
    exclude 'com/cyberday1/**'
}
